name: Habit Reminders

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: habit-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      NODE_ENV: production
      PORT: "8000"

      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
      REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}

      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Validate VAPID key format
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const pub = process.env.VAPID_PUBLIC_KEY ?? "";
          const priv = process.env.VAPID_PRIVATE_KEY ?? "";

          const validFormat = key => /^[A-Za-z0-9_-]+$/.test(key);
          const decode = key =>
            Buffer.from(
              key.replace(/-/g, "+").replace(/_/g, "/"),
              "base64"
            );

          const publicBytes = validFormat(pub) ? decode(pub).length : 0;
          const privateBytes = validFormat(priv) ? decode(priv).length : 0;

          console.log(`Public key: ${publicBytes} decoded bytes`);
          console.log(`Private key: ${privateBytes} decoded bytes`);

          if (publicBytes !== 65 || privateBytes !== 32) {
            console.error("VAPID key format is invalid.");
            process.exit(1);
          }
          NODE
